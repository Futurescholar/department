{% if page.has_other_pages %}
<p class="pager">
  {% if page.has_previous %}<a href="?{{ qs }}&page={{ page.previous_page_number }}">&laquo; Previous</a>{% endif %}
  Page {{ page.number }} of {{ page.paginator.num_pages }}
  {% if page.has_next %}<a href="?{{ qs }}&page={{ page.next_page_number }}">Next &raquo;</a>{% endif %}
</p>
{% endif %}
